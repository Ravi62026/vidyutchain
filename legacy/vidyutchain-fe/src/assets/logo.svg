<svg width="320" height="70" viewBox="0 0 320 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient Text -->
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Keyframes for animation -->
    <style>
      .bolt {
        animation: pulse 1.5s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.9; }
      }

      .rounded-font {
        font-family: 'Segoe UI', 'Poppins', 'Helvetica Neue', sans-serif;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Lightning Bolt -->
  <g filter="url(#glow)">
    <path class="bolt" d="M30 5L15 25H28L12 45L40 20H25L30 5Z" fill="#9333EA"/>
    
    <!-- Solar Panel -->
    <rect x="50" y="12" width="26" height="26" rx="4" fill="#4F46E5"/>
    <rect x="53" y="15" width="8" height="8" rx="1.5" fill="#A5B4FC"/>
    <rect x="63" y="15" width="8" height="8" rx="1.5" fill="#A5B4FC"/>
    <rect x="53" y="25" width="8" height="8" rx="1.5" fill="#A5B4FC"/>
    <rect x="63" y="25" width="8" height="8" rx="1.5" fill="#A5B4FC"/>
  </g>

  <!-- Brand Name -->
  <text x="95" y="38" class="rounded-font" font-weight="600" font-size="26" fill="url(#textGradient)">
    VidyutChain
  </text>

  <!-- Tagline -->
  <text x="95" y="55" class="rounded-font" font-size="13" fill="#C7D2FE">
    Decentralized Energy Platform
  </text>
</svg>
